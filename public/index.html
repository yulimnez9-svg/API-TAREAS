<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App de Tareas</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f2f2f2; }
    h1 { color: #333; }
    .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    input, textarea, button { display: block; margin: 10px 0; padding: 10px; width: 100%; }
    button { background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #0056b3; }
    ul { list-style: none; padding: 0; }
    li { padding: 10px; background: #e9ecef; margin-bottom: 5px; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Mis Tareas</h1>

    <!-- -------------- LOGIN REAL ---------------- -->
    <h2>Iniciar Sesión</h2>
    <input type="email" id="loginEmail" placeholder="Correo electrónico" />
    <input type="password" id="loginPassword" placeholder="Contraseña" />
    <button id="loginBtn">Login</button>

    <hr />

    <!-- -------------- CREAR TAREA ---------------- -->
    <h2>Agregar nueva tarea</h2>
    <input type="text" id="title" placeholder="Título" />
    <textarea id="description" placeholder="Descripción"></textarea>
    <button id="addTodo">Agregar tarea</button>

    <h2>Tareas existentes</h2>
    <ul id="todoList"></ul>
  </div>

  <script>
    let token = null; // El token se guardará aquí después de login

    // -------------- LOGIN REAL --------------
    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value.trim();

      if (!email || !password) {
        alert("Ingresa email y contraseña");
        return;
      }

      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          alert(data.message || "Error al iniciar sesión");
          return;
        }

        token = "Bearer " + data.token;
        alert("Login exitoso!");

        cargarTareas();

      } catch (error) {
        console.error(error);
        alert("Error en el login");
      }
    });

    // -------------- CARGAR TAREAS --------------
    async function cargarTareas() {
      if (!token) {
        alert("Debes iniciar sesión primero");
        return;
      }

      try {
        const res = await fetch("/todos", {
          headers: { Authorization: token }
        });

        if (!res.ok) throw new Error();

        const data = await res.json();
        const lista = document.getElementById("todoList");

        lista.innerHTML = "";
        (data.data || []).forEach(t => {
          const li = document.createElement("li");
          li.textContent = `${t.title} - ${t.description}`;
          lista.appendChild(li);
        });

      } catch (error) {
        console.error(error);
        alert("Error al cargar tareas");
      }
    }

    // -------------- AGREGAR TAREA --------------
    document.getElementById("addTodo").addEventListener("click", async () => {
      if (!token) {
        alert("Debes iniciar sesión primero");
        return;
      }

      const title = document.getElementById("title").value.trim();
      const description = document.getElementById("description").value.trim();

      if (!title) {
        alert("Ingresa un título");
        return;
      }

      try {
        const res = await fetch("/todos", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: token
          },
          body: JSON.stringify({ title, description })
        });

        if (!res.ok) throw new Error();

        document.getElementById("title").value = "";
        document.getElementById("description").value = "";
        cargarTareas();

      } catch (error) {
        console.error(error);
        alert("Error al agregar la tarea");
      }
    });

  </script>
</body>
</html>
